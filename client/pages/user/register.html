<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Tender Monitoring System</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <header>
    <a href="/index.html" class="header-img-link">
      <img src="/assets/south-africa.png" alt="SA Flag" class="header-img">
    </a>
    <h1 class="header-title">Tender Monitoring &amp; Verification System</h1>
    <div class="header-auth">
      <div id="authLinks"></div>
      <button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p id="registerError" class="form-error" role="alert"></p>

      <form id="registrationForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" autocomplete="name" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password <small>(min 8 characters)</small></label>
          <input type="password" id="password" autocomplete="new-password" minlength="8" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role" required>
            <option value="contractor">Contractor</option>
            <option value="investor">Investor</option>
            <option value="government">Government Official</option>
          </select>
        </div>
        <button type="submit" class="btn-primary btn-full">Register</button>
      </form>

      <div class="auth-footer-links">
        <a href="/login.html">Already have an account? Login</a>
      </div>
    </div>
  </main>

  <div class="spinner" id="loadingSpinner" aria-hidden="true"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/pages/user/register.js"></script>
</body>
</html>
