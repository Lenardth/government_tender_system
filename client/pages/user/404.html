<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found h1 { font-size: 6rem; color: #004B87; margin: 0; line-height: 1; }
    .not-found h2 { font-size: 1.5rem; color: #333; margin: 12px 0 20px; }
    .not-found p  { color: #666; margin-bottom: 28px; }
    .not-found a  {
      background: #004B87; color: white; padding: 12px 28px;
      border-radius: 6px; text-decoration: none; font-weight: bold;
      transition: background 0.2s;
    }
    .not-found a:hover { background: #002147; }
  </style>
</head>
<body>

<main id="page-content">
  <div class="not-found">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/index.html">Back to Home</a>
  </div>
</main>

<script src="/js/layout.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
