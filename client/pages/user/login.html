<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Tender Monitoring System</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<main id="page-content" class="auth-page">
  <div class="auth-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your account to continue</p>
    <p id="loginError" class="form-error" role="alert"></p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary btn-full">Login</button>
    </form>
    <div class="auth-footer-links">
      <a href="/register.html">Create an account</a>
    </div>
  </div>
</main>

<script src="/js/layout.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/pages/user/login.js"></script>
</body>
</html>
