<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Tender Monitoring System</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <header>
    <a href="/index.html" class="header-img-link">
      <img src="/assets/south-africa.png" alt="SA Flag" class="header-img">
    </a>
    <h1 class="header-title">Tender Monitoring &amp; Verification System</h1>
    <div class="header-auth">
      <div id="authLinks"></div>
      <button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h2 class="auth-title">System Login</h2>
      <p id="loginError" class="form-error" role="alert"></p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary btn-full">Login</button>
      </form>

      <div class="auth-footer-links">
        <a href="/register.html">Create an account</a>
      </div>
    </div>
  </main>

  <div class="spinner" id="loadingSpinner" aria-hidden="true"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/pages/user/login.js"></script>
</body>
</html>
