<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents — Tender Monitoring System</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/documents.css">
</head>
<body>

<main id="page-content" class="documents-container">
  <h1>Download Tender Documents</h1>
  <div class="documents-intro">
    <p>Access all the necessary documents for tender applications, project guidelines, and regulatory requirements.</p>
  </div>

  <div class="document-categories">
    <button class="category-btn active" onclick="filterDocuments('all',this)">All Documents</button>
    <button class="category-btn" onclick="filterDocuments('application',this)">Application Forms</button>
    <button class="category-btn" onclick="filterDocuments('guidelines',this)">Guidelines</button>
    <button class="category-btn" onclick="filterDocuments('templates',this)">Templates</button>
    <button class="category-btn" onclick="filterDocuments('regulations',this)">Regulations</button>
  </div>

  <div class="documents-list" id="documentsList"></div>
</main>

<script src="/js/layout.js"></script>
<script src="/js/auth.js"></script>
<script>
const DOCS = [
  { title:'Standard Tender Application Form',        description:'Official application form for all government tenders.',                          fileSize:'245 KB',  fileType:'PDF',  lastUpdated:'March 15, 2025',   category:'application' },
  { title:'Tender Submission Guidelines',            description:'Comprehensive guidelines for preparing and submitting tender applications.',      fileSize:'1.2 MB',  fileType:'PDF',  lastUpdated:'February 28, 2025', category:'guidelines'  },
  { title:'Project Budget Template',                 description:'Excel template for preparing detailed project budgets.',                         fileSize:'380 KB',  fileType:'XLSX', lastUpdated:'March 10, 2025',   category:'templates'   },
  { title:'Tender Regulations 2025',                 description:'Official government regulations governing the tender process.',                  fileSize:'3.5 MB',  fileType:'PDF',  lastUpdated:'January 5, 2025',  category:'regulations' },
  { title:'Company Profile Template',                description:'Template for preparing company profiles for tender submissions.',                fileSize:'420 KB',  fileType:'DOCX', lastUpdated:'March 5, 2025',    category:'templates'   },
  { title:'BEE Certification Requirements',          description:'Guidelines for BEE certification requirements for tender applications.',         fileSize:'850 KB',  fileType:'PDF',  lastUpdated:'February 15, 2025', category:'guidelines'  },
  { title:'Tax Compliance Declaration Form',         description:'Required form for declaring tax compliance status.',                             fileSize:'180 KB',  fileType:'PDF',  lastUpdated:'March 20, 2025',   category:'application' },
  { title:'Environmental Impact Assessment Template',description:'Template for preparing environmental impact assessments for construction projects.',fileSize:'1.8 MB', fileType:'DOCX', lastUpdated:'February 10, 2025', category:'templates'  },
];

document.addEventListener('DOMContentLoaded', () => {
  const list = document.getElementById('documentsList');
  DOCS.forEach(doc => {
    const card = document.createElement('div');
    card.className = `document-card ${doc.category}`;
    card.innerHTML = `
      <div class="document-icon ${doc.fileType.toLowerCase()}">${doc.fileType}</div>
      <div class="document-details">
        <h3>${doc.title}</h3>
        <p>${doc.description}</p>
        <div class="document-meta">
          <span>${doc.fileType}</span>
          <span>${doc.fileSize}</span>
          <span>Updated: ${doc.lastUpdated}</span>
        </div>
        <button onclick="alert('Downloading: ${doc.title}')">Download</button>
      </div>`;
    list.appendChild(card);
  });
});

function filterDocuments(category, btn) {
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.document-card').forEach(card => {
    card.style.display = (category === 'all' || card.classList.contains(category)) ? 'flex' : 'none';
  });
}
</script>
</body>
</html>
